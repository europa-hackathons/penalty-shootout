// ===== TEAMS — kit colors only, no real crests or logos. Add a team by copying one line! =====
const TEAMS=[
 {id:'miami',    player:'Lionel Messi', no:'10', shirt:['#f6a9c6'],          trim:'#1d1d1f', shorts:'#1d1d1f', socks:'#f6a9c6', num:'#1d1d1f'},
 {id:'barcelona',player:'Lamine Yamal', no:'10', shirt:['#a50044','#004d98'],trim:'#edbb00', shorts:'#004d98', socks:'#a50044', num:'#edbb00'},
 {id:'sweden', player:'Viktor Gyökeres', no:'17', shirt:['#fecc00'],          trim:'#006aa7', shorts:'#006aa7', socks:'#fecc00', num:'#006aa7'}];
let teamIdx=0;try{teamIdx=Math.max(0,TEAMS.findIndex(t=>t.id===localStorage.getItem('team')))}catch(e){}
if(TEAMS[teamIdx].soon)teamIdx=0;
const team=()=>TEAMS[teamIdx];
function pickTeam(i){if(TEAMS[i].soon)return false;teamIdx=i;try{localStorage.setItem('team',TEAMS[i].id)}catch(e){}return true}
const TBTN=TEAMS.map((t,i)=>({i,x:W/2-330+i*230,y:170,w:200,h:250}));
const inTeam=(x,y)=>TBTN.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);
// fills the current shape with the team's shirt (stripes if it has 2 colors)
function kitFill(t,x,y,w,h){if(t.shirt.length===1){const gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,t.shirt[0]);gr.addColorStop(1,t.shirt[0]);g.fillStyle=gr;g.fillRect(x,y,w,h)}
 else{const n=5,sw=w/n;for(let i=0;i<n;i++){g.fillStyle=t.shirt[i%2];g.fillRect(x+i*sw,y,sw+.5,h)}}
 // floodlight shading
 const sh=g.createLinearGradient(x,y,x+w,y+h);sh.addColorStop(0,'rgba(255,255,255,.28)');sh.addColorStop(.5,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,.4)');g.fillStyle=sh;g.fillRect(x,y,w,h)}
function shirtPath(cx,cy,k){g.beginPath();g.moveTo(cx-22*k,cy-38*k);g.lineTo(cx-48*k,cy-26*k);g.lineTo(cx-58*k,cy+2*k);g.lineTo(cx-38*k,cy+8*k);g.lineTo(cx-34*k,cy-6*k);
 g.lineTo(cx-34*k,cy+44*k);g.lineTo(cx+34*k,cy+44*k);g.lineTo(cx+34*k,cy-6*k);g.lineTo(cx+38*k,cy+8*k);g.lineTo(cx+58*k,cy+2*k);g.lineTo(cx+48*k,cy-26*k);g.lineTo(cx+22*k,cy-38*k);
 g.quadraticCurveTo(cx,cy-26*k,cx-22*k,cy-38*k);g.closePath()}
function drawShirtIcon(t,cx,cy,k){g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=12;g.shadowOffsetY=6;shirtPath(cx,cy,k);g.fillStyle='#000';g.fill();g.restore();
 g.save();shirtPath(cx,cy,k);g.clip();kitFill(t,cx-60*k,cy-40*k,120*k,86*k);g.restore();
 g.strokeStyle=t.trim;g.lineWidth=3*k;shirtPath(cx,cy,k);g.stroke();
 g.beginPath();g.moveTo(cx-22*k,cy-38*k);g.quadraticCurveTo(cx,cy-26*k,cx+22*k,cy-38*k);g.lineWidth=5*k;g.stroke();
 g.font=Math.round(34*k)+'px "Russo One",Impact,sans-serif';g.textAlign='center';g.fillStyle=t.num;g.fillText(t.no,cx,cy+22*k)}
function drawTeamPicker(now){
 g.fillStyle='rgba(5,10,18,.72)';g.fillRect(0,0,W,H);
 txt(T.pickTeam,W/2,120,46,'#fff');
 for(const b of TBTN){const t=TEAMS[b.i],on=b.i===teamIdx,lift=on?Math.sin(now/250)*3-4:0;
  g.save();g.fillStyle=on?'rgba(46,204,113,.18)':'rgba(255,255,255,.06)';g.strokeStyle=on?'#2ecc71':'rgba(255,255,255,.25)';g.lineWidth=on?3:1.5;
  if(on){g.shadowColor='#2ecc71';g.shadowBlur=18}g.beginPath();g.roundRect(b.x,b.y+lift,b.w,b.h,16);g.fill();g.stroke();g.restore();
  if(t.soon)g.globalAlpha=.4;drawShirtIcon(t,b.x+b.w/2,b.y+105+lift,1.25);
  txt(T.teams[t.id],b.x+b.w/2,b.y+200+lift,24,on?'#fff':'#cfe0f0');
  {let fs=18;g.font=fs+'px "Russo One",Impact,sans-serif';while(fs>11&&g.measureText(t.player).width>b.w-20){fs--;g.font=fs+'px "Russo One",Impact,sans-serif'}
   txt(t.player,b.x+b.w/2,b.y+230+lift,fs,on?'#f1c40f':'#9fb3c8')}g.globalAlpha=1;
  if(t.soon){g.save();g.translate(b.x+b.w/2,b.y+110);g.rotate(-.18);g.fillStyle='#f1c40f';g.beginPath();g.roundRect(-82,-20,164,40,8);g.fill();g.restore();
   g.save();g.translate(b.x+b.w/2,b.y+110);g.rotate(-.18);txt(T.soon,0,9,22,'#1a1a1a');g.restore()}}
 txt(T.pickHelp,W/2,480,18,'#f1c40f');
}
// ===== THE KICKER — seen from behind, wearing your team's kit =====
function drawKicker(now){
 const t=team();let x=388,y=478,swing=0,run=0;
 if(S.shot){const p=clamp((now-S.shot.t0)/220,0,1);run=Math.sin(p*Math.PI/2);x+=run*62;y-=run*10;swing=Math.sin(Math.min(1,(now-S.shot.t0)/300)*Math.PI)}
 else if(S.phase==='ring')x-=8+Math.sin(now/120)*1.5; // leaning back, ready
 // team picture? (assets/kicker-TEAM.png and kicker-TEAM-kick.png)
 const kicking=S.shot&&now-S.shot.t0<380,pic=(kicking&&IMG['kicker-'+t.id+'-kick'])||IMG['kicker-'+t.id];
 if(pic){const h=kicking&&IMG['kicker-'+t.id+'-kick']?140:165,w=h*pic.width/pic.height,b2=S.shot?0:Math.sin(now/400)*1;
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(x+4,y+2,30,7,0,0,7);g.fill(); // shadow
  g.save();g.translate(x,y);if(!kicking&&S.shot)g.rotate(.08*run); // lean into the follow-through
  g.drawImage(pic,-w/2,-h+4+b2,w,h);g.restore();return}
 const k=1.05,bob=S.shot?0:Math.sin(now/400)*1.2;
 g.save();g.translate(x,y);g.scale(k,k);
 g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(4,4,34,8,0,0,7);g.fill(); // shadow
 // legs: right leg swings forward on the kick
 const leg=(lx,ang,col)=>{g.save();g.translate(lx,-48);g.rotate(ang);
  const lg=g.createLinearGradient(-6,0,6,0);lg.addColorStop(0,'#8a5a3c');lg.addColorStop(.5,'#c98f6a');lg.addColorStop(1,'#7a4a2c');g.fillStyle=lg;g.fillRect(-6,0,12,18); // knee skin
  g.fillStyle=col;g.fillRect(-6.5,16,13,26); // sock
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-6.5,16,13,3);
  g.fillStyle='#111';g.beginPath();g.ellipse(0,44,8,5,0,0,7);g.fill();g.fillStyle='#fff';g.fillRect(-5,42,10,2); // boot
  g.restore()};
 leg(-11,.05,t.socks);leg(11,-swing*.9-run*.2,t.socks);
 // shorts
 g.fillStyle=t.shorts;g.beginPath();g.roundRect(-22,-66+bob,44,24,5);g.fill();
 g.fillStyle='rgba(255,255,255,.12)';g.fillRect(-22,-66+bob,44,4);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(-1,-55+bob,2,13);
 // arms
 const arm=(s,ang)=>{g.save();g.translate(s*24,-118+bob);g.rotate(s*ang);g.save();g.beginPath();g.roundRect(-7,0,14,22,6);g.clip();kitFill(t,-7,0,14,22);g.restore();
  g.fillStyle='#b97f5a';g.beginPath();g.roundRect(-5.5,20,11,28,5);g.fill();g.restore()};
 arm(-1,.25+run*.5);arm(1,.25+swing*.6);
 // torso (back of the shirt)
 g.save();g.beginPath();g.moveTo(-26,-124+bob);g.quadraticCurveTo(0,-132+bob,26,-124+bob);g.lineTo(23,-64+bob);g.lineTo(-23,-64+bob);g.closePath();g.clip();
 kitFill(t,-27,-132+bob,54,70);g.restore();
 g.strokeStyle=t.trim;g.lineWidth=3;g.beginPath();g.moveTo(-10,-128+bob);g.quadraticCurveTo(0,-125+bob,10,-128+bob);g.stroke();
 g.font='30px "Russo One",Impact,sans-serif';g.textAlign='center';g.fillStyle=t.num;g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.fillText(t.no,0,-80+bob);g.strokeText(t.no,0,-80+bob);
 // neck + head (back of head, hair)
 g.fillStyle='#b97f5a';g.fillRect(-5,-138+bob,10,10);
 const hg=g.createRadialGradient(-4,-154+bob,2,0,-150+bob,14);hg.addColorStop(0,'#5a3a22');hg.addColorStop(1,'#1e120a');
 g.fillStyle=hg;g.beginPath();g.ellipse(0,-150+bob,12,14,0,0,7);g.fill();
 g.fillStyle='#b97f5a';g.beginPath();g.ellipse(-12,-149+bob,2.5,4,0,0,7);g.ellipse(12,-149+bob,2.5,4,0,0,7);g.fill(); // ears
 g.restore();
}
// language buttons on the start screen
const LBTN=[{l:'en',x:20,y:20,w:180,h:58},{l:'sv',x:210,y:20,w:180,h:58}];
const inBtn=(x,y)=>LBTN.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);
// Home-screen control choices and optional webcam tutorial.
const MANUALBTN={x:90,y:285,w:365,h:88},CAMERABTN={x:505,y:285,w:365,h:88};
const TUTORIALBTN={x:505,y:385,w:365,h:42},PLAYBTN={x:350,y:458,w:260,h:62};
const TUTORIALEXIT={x:18,y:458,w:214,h:58};
const hit=(p,x,y)=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h;
let controlMode='manual';
let tutorialActive=false;

function flag(l,x,y){const w=42,h=28;g.save();g.beginPath();g.roundRect(x,y,w,h,3);g.clip();
 if(l==='sv'){g.fillStyle='#006aa7';g.fillRect(x,y,w,h);g.fillStyle='#fecc00';g.fillRect(x+12,y,6,h);g.fillRect(x,y+11,w,6)}
 else{for(let i=0;i<13;i++){g.fillStyle=i%2?'#fff':'#b22234';g.fillRect(x,y+i*h/13,w,h/13+.5)} // US flag
  g.fillStyle='#3c3b6e';g.fillRect(x,y,w*.42,h*7/13);g.fillStyle='#fff';
  for(let r=0;r<5;r++)for(let c=0;c<(r%2?5:6);c++){g.beginPath();g.arc(x+2+(r%2?3.3:1.6)+c*3.2,y+1.8+r*3,.75,0,7);g.fill()}}
 g.restore()}
function drawLangButtons(){
 txt(T.lang,210,98,14,'#9fb3c8');
 for(const b of LBTN){const on=b.l===LANG;g.save();
  g.fillStyle=on?'rgba(46,204,113,.25)':'rgba(255,255,255,.07)';g.strokeStyle=on?'#2ecc71':'rgba(255,255,255,.3)';g.lineWidth=on?3:1.5;
  if(on){g.shadowColor='#2ecc71';g.shadowBlur=14}g.beginPath();g.roundRect(b.x,b.y,b.w,b.h,12);g.fill();g.stroke();g.restore();
  flag(b.l,b.x+16,b.y+15);txt(TEXT[b.l].name,b.x+70,b.y+37,20,on?'#fff':'#cfe0f0','left')}
}
const BOSS_EN=[{n:'Rexo the T-Rex',d:'Tiny arms: low shots are hard for him to reach.'},{n:'Kraken Keeper',d:'Tentacles block the corners. Only green gets through.'},{n:'Frostbite',d:'An ice blast slows your ring on one kick.'},{n:'The Titan',d:'Teleports to your aim. Only green beats him.'},{n:'Gargoyle Gus',d:'Frozen until you kick, then lightning fast.'}];
const bossOf=l=>l%3===0?(l/3-1)%5:-1;
let ac;function snd(f,d,type,v){try{ac=ac||new AudioContext();const o=ac.createOscillator(),a=ac.createGain();o.type=type||'sine';o.frequency.value=f;a.gain.value=v||.12;o.connect(a);a.connect(ac.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function sw(f0,f1,d,type,v){try{ac=ac||new AudioContext();const o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);a.gain.setValueAtTime(v||.15,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
// each boss has its own sound for its signature move
function bossSfx(i){[()=>{sw(220,60,.5,'sawtooth',.2);sw(330,90,.45,'square',.08)}, // Rexo: roar
 ()=>{for(let k=0;k<4;k++)setTimeout(()=>sw(180+k*40,90,.18,'sine',.16),k*70)}, // Kraken: squelch
 ()=>{sw(1800,2600,.25,'sine',.1);setTimeout(()=>sw(2400,1500,.3,'triangle',.08),120)}, // Frostbite: icy chime
 ()=>{sw(900,200,.22,'square',.1);setTimeout(()=>sw(200,900,.18,'square',.1),160)}, // Titan: zap
 ()=>{sw(90,50,.35,'sawtooth',.2);setTimeout(()=>snd(70,.25,'square',.25),240)}][i]()} // Gus: stone slam
// crowd moved into HD GRAPHICS below
function pos(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*H/r.height]}
function aimTo(ev){const[x,y]=pos(ev);S.tx=clamp((x-G.x)/G.w,0,1);S.ty=clamp((y-G.y)/G.h,0,1)}
function newLevel(){S.ice=Math.floor(Math.random()*5);S.kick=0;S.goals=0;S.res=[];S.tx=.5;S.ty=.5;nextAim();best=Math.max(best,S.level);try{localStorage.setItem('best',best)}catch(e){}}
function nextAim(){S.phase='aim';S.shot=null;S.k={ax:.5,ay:.65,bx:.5,by:.65,t0:0,dur:.35}}
function advance(){if(S.phase==='end'&&S.goals>=3)S.level++;newLevel();bgDirty=true;if(bossOf(S.level)>=0){S.phase='intro';S.t1=performance.now();bossSfx(bossOf(S.level));setTimeout(()=>snd(80,.5,'square',.2),250)}}
function startRing(){S.phase='ring';S.t0=performance.now();snd(300,.08);if(bossOf(S.level)===2&&S.kick===S.ice)bossSfx(2)}
let skipUp=false;
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();

 if(im){const k=Math.min(230/im.height,260/im.width),w=im.width*k,h=im.height*k;g.save();g.shadowColor=['#7dff8a','#c27dff','#8fd3ff','#ff4d4d','#ffb04d'][bi];g.shadowBlur=26;g.drawImage(im,730-w/2,cy+112-h,w,h);g.restore()}

// ---------- webcam controls (opt-in). Point a finger to aim, make a fist to start the ring, open the hand to kick ----------
// Hand tracking is Google MediaPipe Hand Landmarker; it runs in the browser and no video leaves the computer.
const CAM={on:false,state:'off',err:'',vid:null,lm:null,cv:null,c2:null,lastTs:0,id:0,seen:false,seenT:0,hits:0,fist:false,fc:0,fistT:0,hist:[],f:null,jn:0,px:0,py:0,tx:.5,ty:.5,pts:null,lat:120,zoom:1.25};
const CAMBTN={x:20,y:470,w:340,h:48},inCam=(x,y)=>x>=CAMBTN.x&&x<=CAMBTN.x+CAMBTN.w&&y>=CAMBTN.y&&y<=CAMBTN.y+CAMBTN.h;
function camToggle(){CAM.on?camStop():camStart()}
function camStop(err){CAM.on=false;CAM.state=err?'error':'off';CAM.seen=false;CAM.pts=null;CAM.f=null;CAM.hits=0;CAM.id++;
 try{if(CAM.vid){CAM.vid.srcObject&&CAM.vid.srcObject.getTracks().forEach(t=>t.stop());CAM.vid.srcObject=null;CAM.vid.remove();CAM.vid=null}if(CAM.lm){CAM.lm.close();CAM.lm=null}}catch(e){}}
const camMsg=e=>e&&e.name==='NotAllowedError'?'blocked: allow it in the address bar':e&&e.name==='NotFoundError'?'no camera found':String(e&&e.message||e);
async function camStart(){
 if(CAM.state==='loading')return;CAM.on=true;CAM.state='loading';CAM.err='';
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('needs https or localhost');
  // the video lives in the page (hidden) so every browser keeps decoding it
  const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';document.body.appendChild(v);CAM.vid=v;
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
  await v.play();
  const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',M=await import(V+'/vision_bundle.mjs'),fs=await M.FilesetResolver.forVisionTasks(V+'/wasm');
  const make=d=>M.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.3,minHandPresenceConfidence:.3,minTrackingConfidence:.3});
  try{CAM.lm=await make('GPU')}catch(e){CAM.lm=await make('CPU')}

// one detection per camera frame, independent of how fast the game draws
function camLoop(id){const v=CAM.vid;if(id!==CAM.id||!CAM.on||!v)return;camDetect();const again=()=>camLoop(id);v.requestVideoFrameCallback?v.requestVideoFrameCallback(again):setTimeout(again,33)}
function camDetect(){

 const s=Math.max(960/vw,540/vh)*CAM.zoom,cw=960/s,ch=540/s;   // only the zoomed middle part is shown to the tracker, so hands are bigger

 const ts=Math.max(performance.now(),CAM.lastTs+1);CAM.lastTs=ts;let r;try{r=CAM.lm.detectForVideo(CAM.cv,ts)}catch(e){return}

// One Euro filter: smooth when the hand is still, quick when it moves fast
function camEuro(x,y,t){const c={minCutoff:1.2,beta:.004,dCutoff:1},f=CAM.f;
 if(!f||t-f.t>.5){CAM.f={t,x,y,dx:0,dy:0};return[x,y]}
 const dt=Math.max(1e-3,t-f.t),al=cut=>1/(1+1/(2*Math.PI*cut*dt)),ad=al(c.dCutoff);
 f.dx+=((x-f.x)/dt-f.dx)*ad;f.dy+=((y-f.y)/dt-f.dy)*ad;
 const a=al(c.minCutoff+c.beta*Math.hypot(f.dx,f.dy));f.x+=(x-f.x)*a;f.y+=(y-f.y)*a;f.t=t;return[f.x,f.y]}
function camFeed(h,now){
 CAM.seen=!!h;
 if(!h){CAM.fc=0;CAM.hits=0;if(now-CAM.seenT>600)CAM.f=null;return}   // keep the last position for a moment if the hand is lost
 CAM.seenT=now;CAM.pts=h;CAM.hits++;
 const x=(1-h[8].x)*960,y=h[8].y*540;   // mirrored, in the 960x540 picture the tracker saw
 if(CAM.f&&Math.hypot(x-CAM.px,y-CAM.py)>260&&++CAM.jn<3)return;   // ignore a one-frame spike; accept it if it lasts 3 frames
 if(CAM.jn>=3)CAM.f=null;CAM.jn=0;CAM.px=x;CAM.py=y;
 const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),w=h[0];
 const curled=[[8,6],[12,10],[16,14],[20,18]].map(([t,p])=>d(h[t],w)<d(h[p],w));
 const fist=curled[0]&&curled.slice(1).filter(Boolean).length>=2;   // index curled, plus at least two other fingers
 if(CAM.hits<3)return;   // a new hand must be seen for 3 frames before it counts
 if(fist===CAM.fist)CAM.fc=0;else if(++CAM.fc>=3){   // a pose must hold for 3 camera frames
  CAM.fc=0;CAM.fist=fist;
  if(fist){CAM.fistT=now;
   if(S.phase==='aim'){const o=CAM.hist.filter(q=>q.t<now-200).pop()||CAM.hist[0];if(o){S.tx=o.x;S.ty=o.y}startRing()}} // aim from just before the hand closed
  else if(S.phase==='ring'&&now-CAM.fistT>250){S.t0+=CAM.lat;kick()}}   // opening = kick; shift the timing back by the camera delay
 if(!CAM.fist&&S.phase==='aim'){
  const[fx,fy]=camEuro(x,y,now/1000);
  CAM.tx=clamp((fx/960-.12)/.76,0,1);CAM.ty=clamp((fy/540-.1)/.65,0,1);S.tx=CAM.tx;S.ty=CAM.ty;
  CAM.hist.push({t:now,x:CAM.tx,y:CAM.ty});if(CAM.hist.length>20)CAM.hist.shift()}}

function frame(now){

 }else{drawPosts();drawBall(now)}
